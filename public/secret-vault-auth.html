<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard — Awais Chohan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@100;200;400;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #0a0a0a;
      --text-main: #ffffff;
      --text-muted: #666666;
      --accent: #E50914;
      --border: #222222;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    h1, h2, h3 {
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .heading-huge {
      font-size: clamp(3rem, 6vw, 5rem);
      line-height: 1;
      margin-bottom: 3rem;
    }

    .heading-outline {
      color: var(--text-muted);
      font-weight: 200;
      letter-spacing: 0.02em;
    }

    .full-center {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 3rem;
      background: var(--surface-color);
      border: 1px solid var(--border);
    }

    .dashboard-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .sidebar {
      width: 300px;
      background: var(--surface-color);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 4rem 2.5rem;
    }

    .sidebar-logo {
      font-size: 2rem;
      margin-bottom: 4rem;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      flex-grow: 1;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      text-align: left;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.3s;
      letter-spacing: 0.05em;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--text-main); }
    .nav-btn-danger { color: var(--text-muted); }
    .nav-btn-danger:hover { color: var(--accent); }

    .content-area {
      flex-grow: 1;
      padding: 5rem;
      overflow-y: auto;
    }

    .form-group { margin-bottom: 2rem; }
    
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--border);
      color: var(--text-main);
      padding: 1rem 0;
      font-size: 1.2rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: var(--text-main); }

    input[type="file"] { padding: 1rem 0; width: 100%; }
    input[type="file"]::file-selector-button {
      background: var(--surface-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      margin-right: 1.5rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }
    input[type="file"]::file-selector-button:hover { background: var(--border); }

    .btn {
      background: var(--text-main);
      color: var(--bg-color);
      padding: 1.25rem 2.5rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .btn:hover { background: #cccccc; }
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--surface-color); }
    .btn-danger { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-danger:hover { background: var(--accent); color: var(--text-main); }

    .vault-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    .vault-card {
      border: 1px solid var(--border);
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, border-color 0.3s;
    }
    .vault-card:hover { border-color: var(--text-muted); transform: translateY(-5px); }
    .vault-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-bottom: 1px solid var(--border);
    }
    .vault-card-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: var(--surface-color);
      border: 1px solid var(--border);
      padding: 3rem;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .hidden { display: none !important; }
    .msg { margin-top: 1rem; font-size: 0.875rem; }
    .error { color: var(--accent); }
    .success { color: #4ade80; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="login-view" class="full-center hidden">
    <div class="login-box">
      <h1 class="sidebar-logo text-center" style="margin-bottom:2rem; text-align:center;">AWAIS<br><span style="color:var(--text-muted)">ADMIN</span></h1>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn" id="login-btn" style="width:100%;">Authenticate</button>
      </form>
      <div id="login-msg" class="msg" style="text-align:center;"></div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="dashboard-layout hidden">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <h1 class="sidebar-logo">AWAIS<br><span style="color:var(--text-muted)">ADMIN</span></h1>
      <nav class="nav-menu">
        <button id="nav-upload" class="nav-btn active">Upload Progress</button>
        <button id="nav-manage" class="nav-btn">Manage Vault</button>
      </nav>
      <button id="logout-btn" class="nav-btn nav-btn-danger">Log Out</button>
    </aside>

    <!-- Main Content -->
    <main class="content-area">
      
      <!-- Upload Section -->
      <section id="section-upload">
        <h2 class="heading-huge">UPLOAD <span class="heading-outline">PROGRESS</span></h2>
        <form id="upload-form" style="max-width: 600px;">
          <div class="form-group">
            <label>Image File</label>
            <input type="file" id="file" accept="image/*" required />
          </div>
          <div class="form-group">
            <label>Caption</label>
            <input type="text" id="caption" placeholder="E.g., Day 45: Lean Bulk" required />
          </div>
          <button type="submit" class="btn" id="upload-btn">Upload to Vault</button>
        </form>
        <div id="upload-msg" class="msg"></div>
      </section>

      <!-- Manage Section -->
      <section id="section-manage" class="hidden">
        <h2 class="heading-huge">MANAGE <span class="heading-outline">VAULT</span></h2>
        <div id="vault-list" class="vault-grid"></div>
      </section>

    </main>
  </div>

  <!-- DELETE MODAL -->
  <div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Delete this progress post?</h3>
      <p style="color: var(--text-muted); margin: 1rem 0 2rem 0; font-size: 0.875rem;">
        This action cannot be undone. The image and caption will be permanently removed.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center; width: 100%;">
        <button id="modal-cancel-btn" class="btn btn-outline" style="padding: 1rem 1.5rem;">Cancel</button>
        <button id="modal-confirm-btn" class="btn btn-danger" style="padding: 1rem 1.5rem;">Confirm Delete</button>
      </div>
    </div>
  </div>

  <script src="/supabase-config.js"></script>
  <script>
    const db = window.supabaseClient;

    // View Containers
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const sectionUpload = document.getElementById('section-upload');
    const sectionManage = document.getElementById('section-manage');
    
    // Forms & Buttons
    const loginForm = document.getElementById('login-form');
    const uploadForm = document.getElementById('upload-form');
    const btnNavUpload = document.getElementById('nav-upload');
    const btnNavManage = document.getElementById('nav-manage');
    
    // Messages
    const loginMsg = document.getElementById('login-msg');
    const uploadMsg = document.getElementById('upload-msg');

    // --- NAVIGATION LOGIC ---
    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        showDashboard();
      } else {
        showLogin();
      }
    }
    checkSession();

    function showLogin() {
      loginView.classList.remove('hidden');
      dashboardView.classList.add('hidden');
    }

    function showDashboard() {
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      loadVault(); // Load data in background
    }

    btnNavUpload.addEventListener('click', () => {
      btnNavUpload.classList.add('active');
      btnNavManage.classList.remove('active');
      sectionUpload.classList.remove('hidden');
      sectionManage.classList.add('hidden');
    });

    btnNavManage.addEventListener('click', () => {
      btnNavManage.classList.add('active');
      btnNavUpload.classList.remove('active');
      sectionManage.classList.remove('hidden');
      sectionUpload.classList.add('hidden');
      loadVault(); // Refresh vault when switching
    });

    // --- AUTH LOGIC ---
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      
      btn.textContent = 'AUTHENTICATING...';
      loginMsg.textContent = '';
      
      const { error } = await db.auth.signInWithPassword({ email, password });
      
      btn.textContent = 'AUTHENTICATE';
      if (error) {
        loginMsg.textContent = error.message;
        loginMsg.className = 'msg error';
      } else {
        showDashboard();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      showLogin();
    });

    // --- UPLOAD LOGIC ---
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('file').files[0];
      const caption = document.getElementById('caption').value;
      const btn = document.getElementById('upload-btn');
      if (!file) return;

      btn.textContent = 'UPLOADING...';
      uploadMsg.textContent = '';

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;

        // 1. Storage
        const { error: uploadError } = await db.storage.from('gym-album').upload(fileName, file);
        if (uploadError) throw uploadError;

        // 2. URL
        const { data: { publicUrl } } = db.storage.from('gym-album').getPublicUrl(fileName);

        // 3. Database
        const { error: dbError } = await db.from('progress_posts').insert([{ image_url: publicUrl, caption }]);
        if (dbError) throw dbError;

        uploadMsg.textContent = 'SUCCESSFULLY UPLOADED TO VAULT!';
        uploadMsg.className = 'msg success';
        uploadForm.reset();
        loadVault();

      } catch (err) {
        uploadMsg.textContent = err.message || 'An error occurred';
        uploadMsg.className = 'msg error';
      } finally {
        btn.textContent = 'UPLOAD TO VAULT';
      }
    });

    // --- MANAGE VAULT LOGIC ---
    async function loadVault() {
      const list = document.getElementById('vault-list');
      
      const { data, error } = await db.from('progress_posts').select('*').order('created_at', { ascending: false });
      
      if (error) {
        list.innerHTML = `<p class="msg error">Failed to load vault</p>`;
        return;
      }
      if (!data || data.length === 0) {
        list.innerHTML = '<p class="msg" style="color:var(--text-muted);">Vault is empty.</p>';
        return;
      }

      list.innerHTML = '';
      data.forEach(post => {
        const item = document.createElement('div');
        item.className = 'vault-card';
        item.innerHTML = `
          <img src="${post.image_url}" loading="lazy" />
          <div class="vault-card-body">
            <div>
              <label>Caption</label>
              <input type="text" id="caption-${post.id}" value="${post.caption || ''}" style="border-bottom-color:var(--border);" />
            </div>
            <div style="display:flex; gap:1rem; margin-top:0.5rem;">
              <button onclick="updatePost('${post.id}')" class="btn btn-outline" style="flex:1; padding:0.75rem;">Save</button>
              <button onclick="deletePost('${post.id}', '${post.image_url}')" class="btn btn-danger" style="flex:1; padding:0.75rem;">Delete</button>
            </div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    window.updatePost = async function(id) {
      const newCaption = document.getElementById(`caption-${id}`).value;
      const btn = document.querySelector(`button[onclick="updatePost('${id}')"]`);
      const originalText = btn.textContent;
      btn.textContent = 'SAVING...';
      
      const { error } = await db.from('progress_posts').update({ caption: newCaption }).eq('id', id);
      
      if (error) {
        console.error("Update Error:", error);
        btn.textContent = 'ERROR';
        btn.style.color = 'var(--accent)';
      } else {
        btn.textContent = 'SAVED ✓';
        btn.style.color = '#4ade80';
      }
      
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.color = '';
      }, 2000);
    };

    // --- MODAL & DELETE LOGIC ---
    const deleteModal = document.getElementById('delete-modal');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');
    const modalConfirmBtn = document.getElementById('modal-confirm-btn');
    
    let pendingDeleteId = null;
    let pendingDeleteUrl = null;

    window.deletePost = function(id, imageUrl) {
      pendingDeleteId = id;
      pendingDeleteUrl = imageUrl;
      deleteModal.classList.remove('hidden');
    };

    modalCancelBtn.addEventListener('click', () => {
      pendingDeleteId = null;
      pendingDeleteUrl = null;
      deleteModal.classList.add('hidden');
    });

    modalConfirmBtn.addEventListener('click', async () => {
      if (!pendingDeleteId || !pendingDeleteUrl) return;
      const postId = pendingDeleteId;
      const imageUrl = pendingDeleteUrl;
      
      modalConfirmBtn.textContent = 'DELETING...';
      
      try {
        // Step A: Extract filename and remove from storage
        const filePath = imageUrl.substring(imageUrl.lastIndexOf('/') + 1);
        const { error: storageError } = await db.storage.from('gym-album').remove([filePath]);
        if (storageError) {
          throw storageError;
        }
        
        // Step B: Delete from database table using UUID
        const { error: dbError } = await db.from('progress_posts').delete().eq('id', postId);
        if (dbError) {
          throw dbError;
        }
        
        // Step C: Close modal and refresh UI
        deleteModal.classList.add('hidden');
        modalConfirmBtn.textContent = 'Confirm Delete';
        pendingDeleteId = null;
        pendingDeleteUrl = null;
        
        loadVault();
        
      } catch (err) {
        console.error('Delete Error:', err);
        // Error Recovery: reset text and close modal immediately
        modalConfirmBtn.textContent = 'Confirm Delete';
        deleteModal.classList.add('hidden');
        pendingDeleteId = null;
        pendingDeleteUrl = null;
      }
    });
  </script>
</body>
</html>
